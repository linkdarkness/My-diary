<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937',
                            600: '#374151'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- EN-TÊTE ÉPURÉ -->
    <header class="bg-dark-800/80 backdrop-blur-md border-b border-dark-700 px-4 py-3 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
            </div>
            <h1 class="text-lg font-bold tracking-tight text-white">Mon Studio</h1>
        </div>

        <!-- NAVIGATION PAR ICÔNES -->
        <nav class="flex items-center space-x-1 bg-dark-900 p-1 rounded-xl border border-dark-700">
            <button onclick="switchTab('generator')" id="nav-generator" class="w-10 h-10 rounded-lg flex items-center justify-center text-indigo-400 bg-dark-700 transition-all">
                <i class="fa-solid fa-paintbrush text-base"></i>
            </button>
            <button onclick="switchTab('edit')" id="nav-edit" class="w-10 h-10 rounded-lg flex items-center justify-center text-gray-400 hover:text-white transition-all">
                <i class="fa-solid fa-wand-magic text-base"></i>
            </button>
            <button onclick="switchTab('album')" id="nav-album" class="w-10 h-10 rounded-lg flex items-center justify-center text-gray-400 hover:text-white transition-all">
                <i class="fa-solid fa-images text-base"></i>
            </button>
        </nav>
    </header>

    <!-- CONTENEUR PRINCIPAL -->
    <main class="flex-1 overflow-y-auto relative p-4 pb-24">

        <!-- CONFIGURATION CLÉ API GEMINI -->
        <div class="max-w-lg mx-auto mb-4 bg-dark-800 border border-dark-700 rounded-2xl p-3 shadow-md">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-key text-indigo-400 text-xs"></i>
                    <span class="text-xs font-semibold text-gray-300">Clé API Gemini :</span>
                </div>
                <button onclick="toggleApiKeyInput()" class="text-xs text-indigo-400 hover:underline">Modifier</button>
            </div>
            <div id="api-key-container" class="mt-2 hidden">
                <input type="password" id="api-key-input" placeholder="Entrez votre clé API Gemini (AIza...)" class="w-full bg-dark-900 border border-dark-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-indigo-500 mb-2">
                <button onclick="saveApiKey()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium py-1.5 rounded-lg">Enregistrer la clé</button>
            </div>
        </div>

        <!-- ZONE D'AFFICHAGE CLAIRE DES ERREURS -->
        <div id="error-banner" class="max-w-lg mx-auto mb-4 bg-red-950/80 border border-red-700/60 rounded-2xl p-3 text-red-200 text-xs shadow-lg hidden flex items-start space-x-2">
            <i class="fa-solid fa-triangle-exclamation text-red-400 mt-0.5 text-sm shrink-0"></i>
            <div class="flex-1">
                <span class="font-bold block mb-0.5">Erreur détectée :</span>
                <span id="error-message-text">Une erreur est survenue.</span>
            </div>
            <button onclick="dismissError()" class="text-red-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- ONGLET 1 : GÉNÉRATEUR -->
        <section id="tab-generator" class="space-y-4 max-w-lg mx-auto">
            <div class="bg-dark-800 border border-dark-700 rounded-2xl p-4 shadow-xl">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold uppercase tracking-wider text-gray-400">Description (16:9)</label>
                    <button onclick="generateRandomPrompt()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center space-x-1">
                        <i class="fa-solid fa-dice"></i>
                        <span>Idée aléatoire</span>
                    </button>
                </div>
                
                <div class="relative">
                    <textarea id="prompt-input" rows="3" placeholder="Décrivez votre image réaliste..." class="w-full bg-dark-900 border border-dark-700 rounded-xl p-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                    <button onclick="document.getElementById('prompt-input').value = ''" class="absolute bottom-3 right-3 text-xs text-gray-500 hover:text-gray-300 bg-dark-800 px-2 py-1 rounded">Effacer</button>
                </div>

                <button onclick="generateImages()" id="generate-btn" class="w-full mt-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition-all active:scale-[0.98]">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Générer les 4 images 16:9 (Gemini)</span>
                </button>
            </div>

            <!-- ZONE DE RÉSULTATS -->
            <div id="results-container" class="space-y-4 hidden">
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Résultats récents</h3>
                <div id="results-grid" class="grid grid-cols-1 gap-4">
                    <!-- Les images générées apparaîtront ici -->
                </div>
            </div>

            <!-- CHARGEMENT -->
            <div id="loading-container" class="hidden flex flex-col items-center justify-center py-12 space-y-4">
                <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <p id="loading-status-text" class="text-sm text-gray-400 font-medium">Interrogation de Gemini en cours...</p>
            </div>
        </section>

        <!-- ONGLET 2 : RETOUCHE / IMAGE-TO-IMAGE -->
        <section id="tab-edit" class="space-y-4 max-w-lg mx-auto hidden">
            <div class="bg-dark-800 border border-dark-700 rounded-2xl p-4 shadow-xl">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Source pour retouche</h3>
                
                <div id="edit-preview-container" class="border-2 border-dashed border-dark-600 rounded-xl p-6 text-center cursor-pointer hover:border-indigo-500 transition-colors relative overflow-hidden" onclick="document.getElementById('file-input').click()">
                    <div id="edit-placeholder" class="space-y-2">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400"></i>
                        <p class="text-xs text-gray-400">Appuyez pour importer une image ou choisissez depuis l'album</p>
                    </div>
                    <img id="edit-img-preview" class="w-full h-auto rounded-lg hidden object-cover aspect-video" />
                </div>
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

                <div class="mt-4 space-y-2">
                    <label class="text-xs font-semibold uppercase tracking-wider text-gray-400">Modifications souhaitées</label>
                    <textarea id="edit-prompt-input" rows="2" placeholder="Ex: Transformer en coucher de soleil dramatique..." class="w-full bg-dark-900 border border-dark-700 rounded-xl p-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                </div>

                <button onclick="applyAuraEdit()" class="w-full mt-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-purple-600/30 flex items-center justify-center space-x-2 transition-all active:scale-[0.98]">
                    <i class="fa-solid fa-wand-sparkles"></i>
                    <span>Appliquer la retouche Gemini</span>
                </button>
            </div>
        </section>

        <!-- ONGLET 3 : ALBUM PERSISTANT -->
        <section id="tab-album" class="space-y-4 max-w-lg mx-auto hidden">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Mon Album</h3>
                <!-- FILTRES ALBUM -->
                <div class="flex bg-dark-800 p-1 rounded-lg border border-dark-700 text-xs">
                    <button onclick="filterAlbum('all')" id="filter-all" class="px-3 py-1.5 rounded-md bg-indigo-600 text-white font-medium transition-all">Tous</button>
                    <button onclick="filterAlbum('favorites')" id="filter-favorites" class="px-3 py-1.5 rounded-md text-gray-400 hover:text-white transition-all">Favoris ⭐</button>
                </div>
            </div>

            <!-- BOUTON SÉLECTION / SUPPRESSION MULTIPLE -->
            <div class="flex items-center justify-between bg-dark-800 border border-dark-700 p-2.5 rounded-xl">
                <button onclick="toggleSelectMode()" id="select-mode-btn" class="text-xs font-medium text-indigo-400 hover:text-indigo-300 flex items-center space-x-1.5">
                    <i class="fa-solid fa-list-check"></i>
                    <span id="select-mode-text">Sélectionner des photos</span>
                </button>
                <div id="selection-actions" class="hidden space-x-2">
                    <button onclick="selectAllPhotos()" class="text-xs bg-dark-700 hover:bg-dark-600 text-gray-200 px-2.5 py-1 rounded-lg">Tout cocher</button>
                    <button onclick="deleteSelectedPhotos()" class="text-xs bg-red-600/80 hover:bg-red-600 text-white px-2.5 py-1 rounded-lg flex items-center space-x-1">
                        <i class="fa-solid fa-trash"></i>
                        <span>Supprimer (<span id="selected-count">0</span>)</span>
                    </button>
                </div>
            </div>

            <div id="album-grid" class="grid grid-cols-2 gap-3">
                <!-- Les images enregistrées s'afficheront ici -->
            </div>
            
            <div id="album-empty" class="text-center py-16 text-gray-500 hidden">
                <i class="fa-regular fa-image text-4xl mb-2"></i>
                <p class="text-sm">Aucune image dans l'album pour le moment.</p>
            </div>
        </section>

    </main>

    <!-- MODALE PLEIN ÉCRAN -->
    <div id="fullscreen-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-between p-4">
        <div class="flex justify-between items-center">
            <span id="modal-date" class="text-xs text-gray-400"></span>
            <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-dark-800 text-white flex items-center justify-center">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="flex-1 flex items-center justify-center my-2">
            <img id="modal-img" class="max-h-[75vh] max-w-full rounded-xl object-contain shadow-2xl aspect-video" />
        </div>
        <div class="flex items-center justify-around bg-dark-800/90 border border-dark-700 p-3 rounded-2xl backdrop-blur-md">
            <button onclick="modalToggleFavorite()" id="modal-fav-btn" class="flex flex-col items-center text-gray-400 hover:text-amber-400 text-xs space-y-1">
                <i class="fa-regular fa-star text-lg" id="modal-fav-icon"></i>
                <span>Favori</span>
            </button>
            <button onclick="modalVariant()" class="flex flex-col items-center text-gray-400 hover:text-indigo-400 text-xs space-y-1">
                <i class="fa-solid fa-arrows-rotate text-lg"></i>
                <span>Variante</span>
            </button>
            <button onclick="modalSendToEdit()" class="flex flex-col items-center text-gray-400 hover:text-purple-400 text-xs space-y-1">
                <i class="fa-solid fa-wand-magic text-lg"></i>
                <span>Retoucher</span>
            </button>
            <button onclick="modalDownload()" class="flex flex-col items-center text-gray-400 hover:text-green-400 text-xs space-y-1">
                <i class="fa-solid fa-download text-lg"></i>
                <span>Télécharger</span>
            </button>
            <button onclick="modalDelete()" class="flex flex-col items-center text-gray-400 hover:text-red-400 text-xs space-y-1">
                <i class="fa-solid fa-trash text-lg"></i>
                <span>Supprimer</span>
            </button>
        </div>
    </div>

    <!-- LOGIQUE JAVASCRIPT -->
    <script>
        let album = JSON.parse(localStorage.getItem('mon_studio_album') || '[]');
        let currentModalIndex = null;
        let currentFilter = 'all';
        let selectedEditImageBase64 = null;
        let isSelectMode = false;
        let selectedPhotoIds = new Set();
        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';

        const randomPrompts = [
            "Un paysage mystique de forêt de redwoods en Californie avec des rayons de soleil filtrant à travers la brume, photoréaliste 8k",
            "Une vue panoramique d'un lagon tropical turquoise avec des bungalows sur l'eau au coucher du soleil, style cinématographique",
            "Un portrait rapproché d'un chat majestueux portant un casque d'astronaute futuriste, nébuleuse spatiale en arrière-plan",
            "Une rue de Tokyo animée sous la pluie la nuit avec des reflets de néons colorés sur le bitume mouillé, ultra détaillé",
            "Un chalet en bois chaleureux isolé dans les montagnes enneigées sous une aurore boréale spectaculaire"
        ];

        function showError(message) {
            const banner = document.getElementById('error-banner');
            const text = document.getElementById('error-message-text');
            text.textContent = message;
            banner.classList.remove('hidden');
            console.error("Mon Studio Error:", message);
        }

        function dismissError() {
            document.getElementById('error-banner').classList.add('hidden');
        }

        function toggleApiKeyInput() {
            const container = document.getElementById('api-key-container');
            container.classList.toggle('hidden');
            if(!container.classList.contains('hidden') && geminiApiKey) {
                document.getElementById('api-key-input').value = geminiApiKey;
            }
        }

        function saveApiKey() {
            const val = document.getElementById('api-key-input').value.trim();
            if(!val) {
                showError("Veuillez entrer une clé API Gemini valide.");
                return;
            }
            geminiApiKey = val;
            localStorage.setItem('gemini_api_key', geminiApiKey);
            document.getElementById('api-key-container').classList.add('hidden');
            dismissError();
            alert("Clé API Gemini enregistrée avec succès !");
        }

        function generateRandomPrompt() {
            const randomIndex = Math.floor(Math.random() * randomPrompts.length);
            document.getElementById('prompt-input').value = randomPrompts[randomIndex];
        }

        function switchTab(tabId) {
            ['generator', 'edit', 'album'].forEach(id => {
                document.getElementById(`tab-${id}`).classList.add('hidden');
                document.getElementById(`nav-${id}`).className = "w-10 h-10 rounded-lg flex items-center justify-center text-gray-400 hover:text-white transition-all";
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).className = "w-10 h-10 rounded-lg flex items-center justify-center text-indigo-400 bg-dark-700 transition-all";
            
            if (tabId === 'album') {
                resetSelectMode();
                renderAlbum();
            }
        }

        async function generateImages() {
            dismissError();
            const prompt = document.getElementById('prompt-input').value.trim();
            
            if (!prompt) {
                showError("Le champ de description est vide. Veuillez saisir une description pour générer des images.");
                return;
            }

            if (!geminiApiKey) {
                showError("Aucune clé API Gemini configurée. Veuillez cliquer sur 'Modifier' en haut pour renseigner votre clé API.");
                toggleApiKeyInput();
                return;
            }

            document.getElementById('generate-btn').disabled = true;
            document.getElementById('loading-container').classList.remove('hidden');
            document.getElementById('results-container').classList.add('hidden');
            document.getElementById('loading-status-text').textContent = "Envoi de la requête à l'API Gemini (gemini-3.1-flash-image-preview)...";

            const resultsGrid = document.getElementById('results-grid');
            resultsGrid.innerHTML = '';

            try {
                // Appel API officiel Gemini pour la génération d'images
                const response = await fetch(`https://generativelanguage.googleapis.com/v1alpha/models/gemini-3.1-flash-image-preview:generateContent?key=${geminiApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `Generate 4 photorealistic widescreen 16:9 images based on this description: ${prompt}` }]
                        }]
                    })
                });

                if (!response.ok) {
                    const errJson = await response.json().catch(() => ({}));
                    const errDesc = errJson.error?.message || `Erreur HTTP ${response.status} - Accès refusé ou quota dépassé`;
                    throw new Error(errDesc);
                }

                const data = await response.json();
                let imageUrls = [];

                // Extraction des images de la réponse Gemini
                if (data.candidates && data.candidates[0]?.content?.parts) {
                    for (const part of data.candidates[0].content.parts) {
                        if (part.inlineData && part.inlineData.data) {
                            const mime = part.inlineData.mimeType || 'image/png';
                            imageUrls.push(`data:${mime};base64,${part.inlineData.data}`);
                        }
                    }
                }

                // Fallback de démonstration si le modèle retourne uniquement du texte ou pas assez d'images binaires
                if (imageUrls.length === 0) {
                    throw new Error("L'API Gemini n'a pas retourné d'image binaire exploitable (le modèle a peut-être répondu avec du texte explicatif). Vérifiez votre prompt ou vos quotas.");
                }

                imageUrls.forEach(url => {
                    const item = {
                        id: Date.now() + Math.random(),
                        url: url,
                        prompt: prompt,
                        date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                        favorite: false
                    };
                    album.unshift(item);

                    const card = document.createElement('div');
                    card.className = "relative rounded-xl overflow-hidden bg-dark-800 border border-dark-700 shadow-md aspect-video group";
                    card.innerHTML = `
                        <img src="${url}" loading="lazy" class="w-full h-full object-cover cursor-pointer" onclick="openModalById('${item.id}')">
                        <div class="absolute bottom-2 right-2 flex space-x-1 bg-black/60 backdrop-blur-md p-1 rounded-lg">
                            <button onclick="toggleFavorite('${item.id}')" class="w-8 h-8 rounded-md flex items-center justify-center text-white hover:text-amber-400">
                                <i class="${item.favorite ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star"></i>
                            </button>
                            <button onclick="downloadImage('${url}')" class="w-8 h-8 rounded-md flex items-center justify-center text-white hover:text-green-400">
                                <i class="fa-solid fa-download"></i>
                            </button>
                            <button onclick="replicateVariant('${encodeURIComponent(prompt)}')" class="w-8 h-8 rounded-md flex items-center justify-center text-white hover:text-indigo-400" title="Variante">
                                <i class="fa-solid fa-arrows-rotate"></i>
                            </button>
                        </div>
                    `;
                    resultsGrid.appendChild(card);
                });

                saveAlbum();
                document.getElementById('results-container').classList.remove('hidden');

            } catch (err) {
                showError("Erreur Gemini : " + err.message);
            } finally {
                document.getElementById('generate-btn').disabled = false;
                document.getElementById('loading-container').classList.add('hidden');
            }
        }

        function replicateVariant(encodedPrompt) {
            document.getElementById('prompt-input').value = decodeURIComponent(encodedPrompt);
            switchTab('generator');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            generateImages();
        }

        function saveAlbum() {
            localStorage.setItem('mon_studio_album', JSON.stringify(album));
        }

        function renderAlbum() {
            const grid = document.getElementById('album-grid');
            const empty = document.getElementById('album-empty');
            grid.innerHTML = '';

            const filtered = album.filter(item => {
                if (currentFilter === 'favorites') return item.favorite;
                return true;
            });

            if (filtered.length === 0) {
                empty.classList.remove('hidden');
                return;
            } else {
                empty.classList.add('hidden');
            }

            filtered.forEach(item => {
                const isSelected = selectedPhotoIds.has(item.id);
                const card = document.createElement('div');
                card.className = `relative rounded-xl overflow-hidden bg-dark-800 border ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/50' : 'border-dark-700'} shadow-md aspect-video group cursor-pointer`;
                
                card.onclick = () => {
                    if (isSelectMode) {
                        togglePhotoSelection(item.id);
                    } else {
                        openModalById(item.id);
                    }
                };

                card.innerHTML = `
                    <img src="${item.url}" loading="lazy" class="w-full h-full object-cover">
                    ${isSelectMode ? `
                        <div class="absolute top-2 left-2 w-6 h-6 rounded-full ${isSelected ? 'bg-indigo-600 text-white' : 'bg-black/60 border border-white/40'} flex items-center justify-center text-xs">
                            ${isSelected ? '<i class="fa-solid fa-check"></i>' : ''}
                        </div>
                    ` : `
                        <div class="absolute top-2 right-2">
                            <button onclick="toggleFavorite('${item.id}'); event.stopPropagation();" class="w-7 h-7 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-white">
                                <i class="${item.favorite ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star text-xs"></i>
                            </button>
                        </div>
                    `}
                `;
                grid.appendChild(card);
            });
        }

        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            selectedPhotoIds.clear();
            const btnText = document.getElementById('select-mode-text');
            const actions = document.getElementById('selection-actions');
            
            if (isSelectMode) {
                btnText.textContent = "Annuler sélection";
                actions.classList.remove('hidden');
                actions.classList.add('flex');
            } else {
                resetSelectMode();
            }
            renderAlbum();
        }

        function resetSelectMode() {
            isSelectMode = false;
            selectedPhotoIds.clear();
            document.getElementById('select-mode-text').textContent = "Sélectionner des photos";
            const actions = document.getElementById('selection-actions');
            actions.classList.add('hidden');
            actions.classList.remove('flex');
            document.getElementById('selected-count').textContent = '0';
        }

        function togglePhotoSelection(id) {
            if (selectedPhotoIds.has(id)) {
                selectedPhotoIds.delete(id);
            } else {
                selectedPhotoIds.add(id);
            }
            document.getElementById('selected-count').textContent = selectedPhotoIds.size;
            renderAlbum();
        }

        function selectAllPhotos() {
            const filtered = album.filter(item => {
                if (currentFilter === 'favorites') return item.favorite;
                return true;
            });
            if (selectedPhotoIds.size === filtered.length) {
                selectedPhotoIds.clear();
            } else {
                filtered.forEach(item => selectedPhotoIds.add(item.id));
            }
            document.getElementById('selected-count').textContent = selectedPhotoIds.size;
            renderAlbum();
        }

        function deleteSelectedPhotos() {
            if (selectedPhotoIds.size === 0) {
                showError("Aucune photo sélectionnée pour la suppression.");
                return;
            }
            if (confirm(`Supprimer les ${selectedPhotoIds.size} photos sélectionnées de l'album ?`)) {
                album = album.filter(item => !selectedPhotoIds.has(item.id));
                saveAlbum();
                resetSelectMode();
                renderAlbum();
            }
        }

        function filterAlbum(filter) {
            currentFilter = filter;
            document.getElementById('filter-all').className = `px-3 py-1.5 rounded-md transition-all ${filter === 'all' ? 'bg-indigo-600 text-white font-medium' : 'text-gray-400 hover:text-white'}`;
            document.getElementById('filter-favorites').className = `px-3 py-1.5 rounded-md transition-all ${filter === 'favorites' ? 'bg-indigo-600 text-white font-medium' : 'text-gray-400 hover:text-white'}`;
            resetSelectMode();
            renderAlbum();
        }

        function toggleFavorite(id) {
            const item = album.find(i => i.id == id);
            if (item) {
                item.favorite = !item.favorite;
                saveAlbum();
                renderAlbum();
                if (currentModalIndex === id) updateModalFavoriteState();
            }
        }

        function openModalById(id) {
            currentModalIndex = id;
            const item = album.find(i => i.id == id);
            if (!item) return;

            document.getElementById('modal-img').src = item.url;
            document.getElementById('modal-date').textContent = item.date;
            updateModalFavoriteState();
            document.getElementById('fullscreen-modal').classList.remove('hidden');
        }

        function updateModalFavoriteState() {
            const item = album.find(i => i.id == currentModalIndex);
            if (!item) return;
            const icon = document.getElementById('modal-fav-icon');
            if (item.favorite) {
                icon.className = "fa-solid text-amber-400 text-lg";
            } else {
                icon.className = "fa-regular fa-star text-lg";
            }
        }

        function closeModal() {
            document.getElementById('fullscreen-modal').classList.add('hidden');
            currentModalIndex = null;
        }

        function modalToggleFavorite() {
            if (currentModalIndex) toggleFavorite(currentModalIndex);
        }

        function modalVariant() {
            const item = album.find(i => i.id == currentModalIndex);
            if (item) {
                closeModal();
                replicateVariant(encodeURIComponent(item.prompt));
            }
        }

        function modalSendToEdit() {
            const item = album.find(i => i.id == currentModalIndex);
            if (item) {
                selectedEditImageBase64 = item.url;
                document.getElementById('edit-img-preview').src = item.url;
                document.getElementById('edit-img-preview').classList.remove('hidden');
                document.getElementById('edit-placeholder').classList.add('hidden');
                closeModal();
                switchTab('edit');
            }
        }

        function modalDownload() {
            const item = album.find(i => i.id == currentModalIndex);
            if (item) downloadImage(item.url);
        }

        function modalDelete() {
            if (confirm("Supprimer cette image de l'album ?")) {
                album = album.filter(i => i.id != currentModalIndex);
                saveAlbum();
                closeModal();
                renderAlbum();
            }
        }

        function downloadImage(url) {
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.download = `mon-studio-${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedEditImageBase64 = e.target.result;
                    document.getElementById('edit-img-preview').src = selectedEditImageBase64;
                    document.getElementById('edit-img-preview').classList.remove('hidden');
                    document.getElementById('edit-placeholder').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function applyAuraEdit() {
            dismissError();
            const prompt = document.getElementById('edit-prompt-input').value.trim();
            if (!selectedEditImageBase64) {
                showError("Veuillez d'abord importer ou sélectionner une image à retoucher.");
                return;
            }
            if (!prompt) {
                showError("Veuillez décrire les modifications souhaitées pour la retouche.");
                return;
            }
            document.getElementById('prompt-input').value = `Modification de l'image précédente: ${prompt}`;
            switchTab('generator');
            generateImages();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur d'images AI</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
    .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 1rem; }
    textarea, input, button { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; }
    button { background: #6366f1; font-weight: bold; cursor: pointer; border: none; }
    button:disabled { background: #444; }
    .result { margin-top: 1rem; text-align: center; }
    img { max-width: 100%; border-radius: 8px; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Générateur d'images</h1>
    
    <input type="password" id="apiKey" placeholder="Clé API (ex: Replicate ou Fal.ai)" />
    <textarea id="prompt" rows="4" placeholder="Entre ton prompt ici..."></textarea>
    <button id="btn" onclick="genererImage()">Générer l'image</button>

    <div class="result">
      <p id="status"></p>
      <img id="imageResult" style="display:none;" alt="Résultat" />
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

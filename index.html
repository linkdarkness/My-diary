<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Jeu Idle Runner</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 18px;
            z-index: 10;
            line-height: 1.4;
            pointer-events: none;
        }
        #shop-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            z-index: 20;
            cursor: pointer;
        }
        #shop-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 350px;
            background-color: #16213e;
            border: 2px solid #e94560;
            border-radius: 12px;
            padding: 20px;
            color: white;
            z-index: 30;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #shop-modal h2 {
            margin-top: 0;
            text-align: center;
            font-size: 22px;
            color: #f9ed69;
        }
        .upgrade-item {
            background: #0f3460;
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .upgrade-item button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
        }
        #close-shop {
            width: 100%;
            margin-top: 15px;
            background-color: #533483;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }
        #offline-popup {
            display: none;
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0f3460;
            border: 2px solid #f9ed69;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 40;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            background: #16213e;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="ui">
        Distance : <span id="score">0</span>m<br>
        Or : <span id="gold">0</span> 🪙
    </div>

    <button id="shop-btn" onclick="toggleShop()">🏪 Boutique</button>

    <div id="offline-popup">
        <h3>Bienvenue !</h3>
        <p>Pendant votre absence, vous avez gagné <span id="offline-gold">0</span> 🪙 !</p>
        <button onclick="closeOfflinePopup()" style="background:#e94560; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold;">Super !</button>
    </div>

    <div id="shop-modal">
        <h2>Boutique d'Améliorations</h2>
        
        <div class="upgrade-item">
            <div>
                <strong>Saut Puissant</strong><br>
                <small>Niveau <span id="lvl-jump">1</span></small>
            </div>
            <button onclick="buyUpgrade('jump')"><span id="cost-jump">10</span> 🪙</button>
        </div>

        <div class="upgrade-item">
            <div>
                <strong>Valeur Pièce +1</strong><br>
                <small>Niveau <span id="lvl-coin">1</span></small>
            </div>
            <button onclick="buyUpgrade('coin')"><span id="cost-coin">15</span> 🪙</button>
        </div>

        <button id="close-shop" onclick="toggleShop()">Reprendre le jeu</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let player = {
            x: 100,
            y: canvas.height - 150,
            width: 40,
            height: 40,
            vy: 0,
            gravity: 0.8,
            jumpForce: -16,
            isGrounded: false
        };

        let groundHeight = 80;
        let distance = 0;
        let gold = 0;
        let gameSpeed = 6;

        let obstacles = [];
        let coins = [];
        let spawnTimer = 0;
        let isShopOpen = false;

        let upgrades = {
            jump: { level: 1, cost: 10, costMultiplier: 1.8 },
            coin: { level: 1, cost: 15, costMultiplier: 2.0 }
        };

        function saveGame() {
            const saveData = {
                gold: gold,
                upgrades: upgrades,
                lastTime: Date.now()
            };
            localStorage.setItem('idle_runner_save', JSON.stringify(saveData));
        }

        function loadGame() {
            const saved = localStorage.getItem('idle_runner_save');
            if (saved) {
                const data = JSON.parse(saved);
                gold = data.gold || 0;
                if (data.upgrades) {
                    upgrades = data.upgrades;
                    player.jumpForce = -16 - (upgrades.jump.level - 1) * 1.5;
                }

                if (data.lastTime) {
                    const elapsedSeconds = Math.floor((Date.now() - data.lastTime) / 1000);
                    if (elapsedSeconds > 10) {
                        const earnedOffline = Math.floor((elapsedSeconds / 60) * upgrades.coin.level * 2);
                        if (earnedOffline > 0) {
                            gold += earnedOffline;
                            document.getElementById('offline-gold').innerText = earnedOffline;
                            document.getElementById('offline-popup').style.display = 'block';
                        }
                    }
                }
            }
            updateShopUI();
        }

        function closeOfflinePopup() {
            document.getElementById('offline-popup').style.display = 'none';
        }

        setInterval(saveGame, 5000);

        function toggleShop() {
            isShopOpen = !isShopOpen;
            const modal = document.getElementById('shop-modal');
            modal.style.display = isShopOpen ? 'block' : 'none';
        }

        function buyUpgrade(type) {
            let up = upgrades[type];
            if (gold >= up.cost) {
                gold -= up.cost;
                up.level++;
                up.cost = Math.floor(up.cost * up.costMultiplier);

                if (type === 'jump') {
                    player.jumpForce = -16 - (up.level - 1) * 1.5;
                }

                updateShopUI();
                saveGame();
            }
        }

        function updateShopUI() {
            document.getElementById('lvl-jump').innerText = upgrades.jump.level;
            document.getElementById('cost-jump').innerText = upgrades.jump.cost;
            document.getElementById('lvl-coin').innerText = upgrades.coin.level;
            document.getElementById('cost-coin').innerText = upgrades.coin.cost;
        }

        window.addEventListener('pointerdown', (e) => {
            if (isShopOpen) return;
            if (e.target.id === 'shop-btn' || e.target.closest('#shop-modal') || e.target.closest('#offline-popup')) return;

            if (player.isGrounded) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
            }
        });

        function spawnEntity() {
            if (isShopOpen) return;
            spawnTimer++;
            if (spawnTimer > 90) {
                spawnTimer = 0;
                let groundLevel = canvas.height - groundHeight;

                if (Math.random() > 0.4) {
                    obstacles.push({
                        x: canvas.width,
                        y: groundLevel - 40,
                        width: 30,
                        height: 40
                    });
                } else {
                    coins.push({
                        x: canvas.width,
                        y: groundLevel - 90 - Math.random() * 60,
                        width: 25,
                        height: 25,
                        collected: false
                    });
                }
            }
        }

        function update() {
            if (isShopOpen) return;

            player.vy += player.gravity;
            player.y += player.vy;

            let groundLevel = canvas.height - groundHeight - player.height;
            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.vy = 0;
                player.isGrounded = true;
            }

            distance += 0.1;
            gameSpeed = 6 + Math.floor(distance / 100);

            spawnEntity();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                // Collision avec un obstacle
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    // Réinitialise la distance et supprime l'obstacle touché (le jeu continue !)
                    distance = 0;
                    obstacles.splice(i, 1);
                    continue;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].x -= gameSpeed;

                if (
                    !coins[i].collected &&
                    player.x < coins[i].x + coins[i].width &&
                    player.x + player.width > coins[i].x &&
                    player.y < coins[i].y + coins[i].height &&
                    player.y + player.height > coins[i].y
                ) {
                    coins[i].collected = true;
                    gold += upgrades.coin.level;
                    saveGame();
                }

                if (coins[i].x + coins[i].width < 0 || coins[i].collected) {
                    coins.splice(i, 1);
                }
            }

            document.getElementById('score').innerText = Math.floor(distance);
            document.getElementById('gold').innerText = gold;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);

            ctx.fillStyle = '#e94560';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = '#e94584';
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }

            ctx.fillStyle = '#f9ed69';
            for (let coin of coins) {
                if (!coin.collected) {
                    ctx.beginPath();
                    ctx.arc(coin.x + coin.width / 2, coin.y + coin.height / 2, coin.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loadGame();
        loop();
    </script>
</body>
</html>

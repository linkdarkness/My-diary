<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon AI Girlfriend</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4effa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 360px;
      height: 550px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0,1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background: #e91e63;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }
    .bot {
      background-color: #f1f1f1;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .user {
      background-color: #e91e63;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .chat-input {
      display: flex;
      padding: 10px;
      border-top: 1px solid #eee;
    }
    .chat-input input {
      flex: 1;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 20px;
      outline: none;
    }
    .chat-input button {
      background: #e91e63;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-left: 8px;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">❤️ Maya</div>
  <div class="chat-messages" id="messages">
    <div class="message bot">Coucou ! Comment s'est passée ta journée ? 💕</div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Écris un message..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">➔</button>
  </div>
</div>

<script>
  // Remplace par ta clé API (attention : ne pas publier cette clé en ligne)
  const API_KEY = "TA_CLE_API_ICI";

  // Prompt système définissant le rôle et la personnalité
  const systemPrompt = "Tu es Maya, une petite amie attentionnée, douce et chaleureuse. Tu parles de manière naturelle, affectueuse et engageante, en utilisant parfois quelques émojis. Tu réponds toujours en français.";

  let conversationHistory = [
    { role: "system", content: systemPrompt },
    { role: "assistant", content: "Coucou ! Comment s'est passée ta journée ? 💕" }
  ];

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    input.value = '';
    conversationHistory.push({ role: "user", content: text });

    try {
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: 'gpt-4o-mini',
          messages: conversationHistory
        })
      });

      const data = await response.json();
      const botReply = data.choices[0].message.content;

      conversationHistory.push({ role: "assistant", content: botReply });
      appendMessage(botReply, 'bot');
    } catch (error) {
      appendMessage("Désolée, j'ai eu un petit souci de connexion...", 'bot');
      console.error(error);
    }
  }

  function appendMessage(text, sender) {
    const messagesDiv = document.getElementById('messages');
    const msg = document.createElement('div');
    msg.classList.add('message', sender);
    msg.textContent = text;
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') sendMessage();
  }
</script>

</body>
</html>

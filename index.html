<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Runner Mobile</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            z-index: 10;
        }
        canvas {
            display: block;
            background: #16213e;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="ui">Distance : <span id="score">0</span>m</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Ajuster la taille du canvas à l'écran du smartphone
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Propriétés du joueur
        let player = {
            x: 100,
            y: canvas.height - 150,
            width: 50,
            height: 50,
            vy: 0,
            gravity: 0.8,
            jumpForce: -16,
            isGrounded: false
        };

        let groundHeight = 80;
        let distance = 0;

        // Contrôle tactile ou clic
        window.addEventListener('pointerdown', () => {
            if (player.isGrounded) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
            }
        });

        // Boucle de jeu
        function update() {
            // Physique du saut
            player.vy += player.gravity;
            player.y += player.vy;

            // Collision avec le sol
            let groundLevel = canvas.height - groundHeight - player.height;
            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.vy = 0;
                player.isGrounded = true;
            }

            // Incrémenter la distance
            distance += 0.1;
            document.getElementById('score').innerText = Math.floor(distance);
        }

        function draw() {
            // Effacer l'écran
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dessiner le sol
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);

            // Dessiner le joueur (carré rouge)
            ctx.fillStyle = '#e94560';
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
